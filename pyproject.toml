[project]
name = "slashcompute"
version = "0.1.0"
description = "/compute pooling engine: pipeline-parallel MLX fine-tuning across pooled Apple Silicon Macs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mlx>=0.22",
    "mlx-lm>=0.21",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=14",
    "httpx>=0.27",
    "sqlmodel>=0.0.16",
    "pydantic>=2.6",
    "msgpack>=1.0",
    "zeroconf>=0.131",
    "typer>=0.12",
    "psutil>=6.0",
    "python-multipart>=0.0.9",
    "pywebview>=5.0",
]

[project.scripts]
slashcompute = "slashcompute.launcher.main:main"
slashcompute-agent = "slashcompute.agent.main:app"
slashcompute-coordinator = "slashcompute.coordinator.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slashcompute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: multi-process end-to-end tests (slower)",
]
